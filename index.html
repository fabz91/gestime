.brand .bt{display:flex;flex-direction:column;gap:5px}
.brand b{font-size:25px;font-weight:800;letter-spacing:.01em}
.brand i{font-style:normal;font-size:19px;font-weight:700;color:var(--acc);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:480px){.top h1.brand{font-size:inherit;gap:7px}.brand .bi{width:42px;height:42px}.brand .bt{gap:3px}.brand b{font-size:17px}.brand i{font-size:13px}}

@media (max-width:480px){.top{gap:4px}.undo{gap:4px}.undo button{padding:6px 9px;font-size:18px}.logo img{height:34px}.logo{padding:2px 5px}.brand .bi{width:38px;height:38px}.brand b{font-size:15px}.brand i{font-size:12px;letter-spacing:.1em}.top h1.brand{gap:5px}}
.brand b{color:var(--ink);letter-spacing:.04em}.brand i{color:var(--ink)}
.ibd{background:#d9381e;color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px 10px 0 0;width:100%}
.ibd .add3{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.7);color:#fff;font-weight:700;padding:3px 12px;border-radius:14px;font-size:12px;letter-spacing:0}
.ibd+.fw{border-top-left-radius:0;border-top-right-radius:0;max-height:calc(100vh - 264px)}
.int3 thead tr:nth-child(1) th{top:0;height:44px}
.int3 thead tr:nth-child(2) th{top:44px;height:auto}

/* bandeaux identiques */
.fl th.gh,.ibd{height:34px;font-size:12px;font-weight:700;letter-spacing:.1em;padding:0}
.fl th.gh .add3{margin:0 0 0 8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.7);color:#fff;font-weight:700;padding:3px 12px;border-radius:14px;font-size:12px;letter-spacing:0}
.ibd.g0{background:var(--acc)}
.lt th.gh{height:34px}.lt thead tr+tr th{top:34px}
.emp3 thead tr:nth-child(1) th{top:0;height:44px}
.emp2 thead tr+tr th{top:34px;height:44px}
.emp2 th.pn,.emp2 th.pa,.emp2 th.c0{background:var(--card);color:var(--ink)}
.emp2 th.pn.g1,.emp2 th.pa.g1{background:var(--card)}
.emp2 .nh input{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.emp2 .nh .xs{background:var(--card);color:var(--dng);border-color:var(--line)}
.fl th.gh.sep{border-left:0}

/* changement de magasin */
.brand .sr{display:flex;align-items:center;gap:7px}
.stb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.stb svg{width:16px;height:16px}
#stp{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:215;display:none;align-items:center;justify-content:center;padding:20px}
#stp.on{display:flex}
#stp .setb button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (max-width:480px){.stb{width:22px;height:22px}.stb svg{width:14px;height:14px}.brand .sr{gap:5px}}

/* ===== Bandeau façon GESMAR ===== */
:root{--gr:#237a3b;--rg:#d3262b}
.top{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px 8px;background:var(--card);margin:-12px -12px 14px;padding:10px 18px 12px;border-bottom:4px solid var(--gr);box-shadow:0 3px 0 0 var(--rg),0 6px 14px rgba(0,0,0,.12)}
.tabs.mode{justify-content:center;gap:8px;margin:0 0 12px;padding:0;flex-wrap:wrap}
.mode button{text-transform:uppercase;letter-spacing:.04em;flex:none;width:132px;padding:7px 10px;font-size:14px;font-weight:700;border-radius:10px}
.mode button.on{background:var(--gr);border-color:var(--gr);color:#fff}
.brand .bi{width:46px;height:46px}
.brand b{font-size:27px;font-weight:900;letter-spacing:.02em;line-height:1}
.brand b .g1{color:var(--ink)}.brand b .g2{color:var(--rg)}
.brand .bt{gap:4px}
.brand i{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.22em}
.top .logo{background:transparent;box-shadow:none;padding:0}.top .logo img{height:46px}
.undo #gr{border-radius:10px}
@media (max-width:640px){.top{padding:8px 10px 0;margin:-12px -12px 12px}.mode button{width:calc(50% - 6px)}.brand b{font-size:19px}.brand .bi{width:36px;height:36px}.brand i{font-size:11px;letter-spacing:.14em}.top .logo img{height:32px}}

/* Fenêtre de dates des congés : champs lisibles en clair et en sombre */
.edp input[type=date]{background:var(--card);color:var(--ink);border:2px solid var(--acc);border-radius:6px;font-weight:700;color-scheme:light}
.edp label{font-weight:700;color:var(--ink)}
:root[data-theme="dark"] .edp input[type=date]{color-scheme:dark;background:#0f1514;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .edp input[type=date]{color-scheme:dark;background:#0f1514;color:#fff}}

/* CP posé dans Congés : affiché dans la case Arrivée des intérims */
input.cpx{width:66px;min-width:66px;font-size:13px;font-weight:800;text-align:center;padding:5px 2px;color:var(--acc);background:var(--accbg);border:1px solid var(--acc);border-radius:6px;cursor:default;box-sizing:border-box}
.card td input.cpx{width:96px;min-width:96px;font-size:14px}

.setb h3 .hr{display:flex;align-items:center;gap:8px}
.syi{display:inline-flex;align-items:center;line-height:0}
.syi.ok{color:#237a3b}.syi.ko{color:#d3262b}.syi.wait{color:var(--mut)}
:root[data-theme="dark"] .syi.ok{color:#4fd37a}:root[data-theme="dark"] .syi.ko{color:#ff7a74}

/* ===== Palette GESMAR (clair et sombre) ===== */
:root{--acc:#237a3b;--accbg:#e2f0e4;--gr:#237a3b}
:root[data-theme="dark"]{--bg:#2e3238;--card:#3a3f47;--ink:#f4f5f7;--mut:#b4bac4;--line:#555b66;--acc:#3fbf3a;--accbg:#2d4a33;--we:#343840;--dng:#ff7a72;--gr:#3fbf3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2e3238;--card:#3a3f47;--ink:#f4f5f7;--mut:#b4bac4;--line:#555b66;--acc:#3fbf3a;--accbg:#2d4a33;--we:#343840;--dng:#ff7a72;--gr:#3fbf3a}}
:root[data-theme="dark"] .top{background:#1e2126}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#1e2126}}
:root[data-theme="dark"] .mode button.on{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 10px rgba(63,191,58,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mode button.on{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 10px rgba(63,191,58,.5)}}
:root[data-theme="dark"] .mode button:not(.on){background:#434850;border-color:#5b616c;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mode button:not(.on){background:#434850;border-color:#5b616c;color:#fff}}

/* ===== Bandeau centré, double filet vert/rouge et logo sur fond blanc (comme GESMAR) ===== */
:root{--rg:#d3262b}
:root[data-theme="dark"]{--rg:#f0473d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rg:#f0473d}}
.top{padding-left:max(18px,calc((100vw - 1280px)/2));padding-right:max(18px,calc((100vw - 1280px)/2));border-bottom:2px solid var(--gr);box-shadow:0 4px 0 0 var(--bg),0 6px 0 0 var(--rg)}
.top .logo{background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.top .logo img{height:44px}
@media (max-width:640px){.top{padding-left:10px;padding-right:10px}.top .logo{padding:2px 5px}.top .logo img{height:30px}}

/* ===== Gris plus foncé et neutre (mode sombre) ===== */
:root[data-theme="dark"]{--bg:#1f2022;--card:#2a2b2e;--line:#45474b;--we:#252629;--mut:#b8bbc0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2022;--card:#2a2b2e;--line:#45474b;--we:#252629;--mut:#b8bbc0}}
:root[data-theme="dark"] .top{background:#151617}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#151617}}
:root[data-theme="dark"] .mode button:not(.on){background:#303134;border-color:#45474b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mode button:not(.on){background:#303134;border-color:#45474b}}
/* ===== Pastille « 1 » : nouvelle version disponible (sur l'engrenage et sur le bouton Mettre à jour), comme GESMAR ===== */
#gr.upd,#upb.upd{position:relative}
#gr.upd::after{content:"1";position:absolute;top:-7px;right:-7px;width:auto;height:17px;min-width:17px;padding:0 4px;border-radius:9px;background:#d3262b;color:#fff;box-shadow:0 0 0 2px var(--card);font:700 11px/17px system-ui,sans-serif;text-align:center}
#upb.upd{display:flex;align-items:center}
#upb.upd::after{content:"1";margin-left:auto;flex:none;width:20px;height:20px;padding:0;box-sizing:border-box;border-radius:10px;background:#d3262b;color:#fff;font:700 12px/20px system-ui,sans-serif;text-align:center}
/* v30 : la pastille « 1 » clignote pour être bien visible */
@keyframes updBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(1.2)}}
#gr.upd::after,#upb.upd::after{animation:updBlink 1s ease-in-out infinite}
/* ===== Engrenage et flèches annuler / rétablir identiques à GESMAR ===== */
.top .undo{gap:8px;align-items:center}
.top .undo button{width:34px;height:34px;padding:0;border-radius:8px;display:grid;place-items:center;font-size:0;line-height:0;color:var(--ink);background:var(--card);border:1px solid var(--line)}
.top .undo button svg{width:17px;height:17px}
.top .undo button:disabled{opacity:.35;cursor:default}
.top .undo button:not(:disabled):hover{color:var(--acc);border-color:var(--acc)}
.top .undo #gr{border-radius:8px}
#gtn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;max-width:min(560px,calc(100vw - 24px));background:#d3262b;color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}

function plan(){

 let h=`<div class="chips">${S.emps.map(x=>`<button class="chip ${x.id===cur?'on':''}" data-act="sel" data-id="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip add" data-act="add">+ Ajouter</button></div>`;
 if(!e)return h+'<p class="mut">Aucun nom. Ajoutez une personne avec « + Ajouter ».</p>';
 const R=recs(e.id,k);let rows='',wi=0,today=new Date();const LV1=leaveDays(e.id,Y,M);
 for(let d=1;d<=n;d++){const wd=new Date(Y,M,d).getDay(),r=R[d]||{},isT=today.getFullYear()===Y&&today.getMonth()===M&&today.getDate()===d;

 return h+`<div class="card"><div class="head"><input type="text" id="nm2" value="${esc(e.name)}" aria-label="Nom"><button class="del" data-act="del">${confirmDel===e.id?'Confirmer ?':'Supprimer'}</button></div>

function flat(){

 const LVI=Object.fromEntries(E.map(q=>[q.id,leaveDays(q.id,Y,M)]));
 let b='';
 for(let d=1;d<=n;d++){const wd=new Date(Y,M,d).getDay(),isT=td.getFullYear()===Y&&td.getMonth()===M&&td.getDate()===d;

 function upg(el){
  if(el.__pz)return;el.__pz=1;
  const cs=getComputedStyle(el);const st={width:cs.width,minWidth:cs.minWidth,padding:cs.padding,textAlign:cs.textAlign,fontSize:cs.fontSize};
  let cv=norm(el.getAttribute('value'));
  el.type='text';el.classList.add('pz');el.setAttribute('inputmode','numeric');el.setAttribute('autocomplete','off');el.placeholder='-:--';
  Object.assign(el.style,st);if(!st.textAlign||st.textAlign==='start')el.style.textAlign='center';
  Object.defineProperty(el,'value',{configurable:true,get(){return cv},set(v){cv=norm(v);nat.set.call(el,show(cv))}});
  nat.set.call(el,show(cv));
  el.__buf=null;el.__all=false;
 }
 function scan(){document.querySelectorAll('input[type=time][data-f=p]').forEach(upg)}
 try{new MutationObserver(scan).observe(document.body,{childList:true,subtree:true})}catch(e){}
 scan();
 const sel=el=>{el.__all=true;el.__buf=null;try{el.select()}catch(e){}};
 document.addEventListener('mousedown',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('pz')&&ev.button===0){ev.preventDefault();t.focus();sel(t)}},true);
 document.addEventListener('focusin',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('pz'))sel(t)},true);
 document.addEventListener('focusout',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('pz')&&t.__buf!=null){t.__buf=null;nat.set.call(t,show(t.value))}},true);
 document.addEventListener('paste',ev=>{if(ev.target.classList&&ev.target.classList.contains('pz'))ev.preventDefault()},true);
 function commit(t,c,jump){t.__buf=null;t.__all=false;t.value=c;t.dispatchEvent(new Event('change',{bubbles:true}));if(jump)setTimeout(()=>t.blur(),0)}

 document.addEventListener('keydown',ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('pz'))return;
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const k=ev.key;
  if(/^[0-9]$/.test(k)){ev.preventDefault();ev.stopImmediatePropagation();
   let b=t.__all||t.__buf==null?'':t.__buf;t.__all=false;b+=k;
   if(b.length===1){t.__buf=b;nat.set.call(t,b+':');return}
   if(b.length===2){const m=k;if(m==='0'){commit(t,'0'+b[0]+':00',true);return}if(m>'5'){commit(t,'0'+b[0]+':0'+m,true);return}t.__buf=b;nat.set.call(t,b[0]+':'+b[1]);return}
   commit(t,'0'+b[0]+':'+b[1]+b[2],true);return}
  if(k==='Backspace'||k==='Delete'){ev.preventDefault();ev.stopImmediatePropagation();
   if(t.__buf&&!t.__all&&t.__buf.length>1){t.__buf=t.__buf.slice(0,-1);nat.set.call(t,t.__buf+':');t.__buf=t.__buf;return}
   t.__all=false;t.__buf=null;nat.set.call(t,'');if(t.value!=='')commit(t,'',false);else nat.set.call(t,'');return}
  if(k==='Enter'&&t.__buf&&t.__buf.length===1&&!t.__all){ev.preventDefault();ev.stopImmediatePropagation();commit(t,'0'+t.__buf+':00',true);return}
  if(k.length===1)ev.preventDefault()},true);
})();

// ===== Changement de magasin =====
(function(){
 const n=document.getElementById('stn');if(n)n.textContent=STORE.name;
 try{document.title='GESTIME'}catch(e){}
 function open(){const o=document.getElementById('stp'),l=document.getElementById('stl');if(!o||!l)return;l.innerHTML=STORES.map(s=>'<button data-st="'+s.id+'" class="'+(s.id===STORE.id?'cur':'')+'">'+s.name+(s.id===STORE.id?'  ✓':'')+'</button>').join('');o.classList.add('on')}
 function close(){const o=document.getElementById('stp');if(o)o.classList.remove('on')}
 async function go(id){if(id===STORE.id){close();return}
  try{if(typeof sy!=='undefined'&&typeof push==='function'&&TOK&&(sy.pend||sy.dirty)){clearTimeout(sy.timer);await push()}}catch(e){}
  try{localStorage.setItem('gt-store',id)}catch(e){}
  location.reload()}
 document.addEventListener('click',ev=>{const t=ev.target;if(!t||!t.closest)return;
  if(t.id==='stp'){close();return}
  const b=t.closest('button');if(!b)return;
  if(b.id==='stsw'){open();return}
  if(b.id==='stx'){close();return}
  if(b.dataset.st){go(b.dataset.st)}
 });
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
})();

// v28-29 : chaque onglet garde sa place dans son Tableau (défilement de la page et des tableaux),
// quand on change d'onglet et après avoir fermé le logiciel. On revient toujours sur « Tableau »
// (jamais sur Récapitulatif ou Création). Mémorisé sur ce PC seulement, par magasin.
const NAV_K='gt-nav-'+STORE.id;let NAV={},NAVK=null,NAVT=null;
try{NAV=JSON.parse(localStorage.getItem(NAV_K)||'{}')||{}}catch(e){NAV={}}
if(NAV.cur){const c=NAV.cur;if(['int','emp','leave','ep'].includes(c.mode))mode=c.mode}
function navKey(){return mode+':'+(mode==='ep'?epview:mode==='emp'?eview:mode==='leave'?lview:view)}
function navGrab(){if(!NAVK)return;NAV.pos=NAV.pos||{};NAV.pos[NAVK]={y:window.scrollY,f:[...document.querySelectorAll('#app .fw')].map(e=>[e.scrollTop,e.scrollLeft])}}
function navStore(){NAV.cur={mode,view,eview,lview,epview};try{localStorage.setItem(NAV_K,JSON.stringify(NAV))}catch(e){}}
function navPut(){const p=NAV.pos&&NAV.pos[NAVK];if(!p)return;const fw=document.querySelectorAll('#app .fw');(p.f||[]).forEach((v,i)=>{if(fw[i]){fw[i].scrollTop=v[0];fw[i].scrollLeft=v[1]}});window.scrollTo(0,p.y||0)}
const render0=render;
render=function(){navGrab();render0();NAVK=navKey();navPut();navStore();requestAnimationFrame(navPut)};
document.addEventListener('scroll',()=>{if(!NAVK)return;clearTimeout(NAVT);NAVT=setTimeout(()=>{navGrab();navStore()},200)},true);
window.addEventListener('beforeunload',()=>{navGrab();navStore()});
render();
boot();

// ===== MISE À JOUR du logiciel (version PC) =====
(function(){if(!window.api||!window.api.updateCheck)return;
 const U=()=>window.SYNC&&window.SYNC.updateUrl,m=t=>{const e=document.getElementById('upm');if(e)e.textContent=t},g=document.getElementById('gr');
 const bl=document.getElementById('updb');if(bl)bl.style.display='';
 let seenV=0,newV=0;function flag(on){on=on&&newV>seenV;if(g)g.classList.toggle('upd',on);const u=document.getElementById('upb');if(u)u.classList.toggle('upd',on)}
 async function ver(){try{const i=await window.api.updateInfo();m('Version installée : '+i.version);const r=document.getElementById('upr');if(r)r.style.display=''}catch(e){}}
 async function chk(silent){const r=await window.api.updateCheck(U());
  if(r.status==='new'){newV=r.remote;flag(true);m('🔔 Nouvelle version disponible ('+r.remote+'), vous avez la '+r.version+'.'+(r.note?' '+r.note:''))}
  else if(!silent){if(r.status==='none')m('✓ Vous avez la dernière version ('+r.version+').');else if(r.status==='noconfig')m('Adresse des mises à jour non réglée (voir LISEZ-MOI-MISE-A-JOUR.txt).');else m('⚠️ Impossible de vérifier : '+(r.msg||'pas de connexion'))}
  return r}
 document.addEventListener('click',async ev=>{const b=ev.target.closest&&ev.target.closest('button');if(!b)return;
  if(b.id==='gr')ver();
  if(b.id==='upb'){seenV=newV;flag(false);b.disabled=true;m('Recherche…');try{const r=await chk(false);if(r.status==='new'){m('Téléchargement…');const a=await window.api.updateApply(U());if(a.status==='done')m('✓ Mise à jour installée, redémarrage…');else m('⚠️ '+(a.msg||'échec'))}}catch(e){m('⚠️ '+e.message)}b.disabled=false}
  if(b.id==='upr'){if(confirm('Revenir à la version fournie par l’installateur ? Vos données ne sont pas touchées.'))window.api.updateReset()}});
 // Vérifie au démarrage, puis toutes les 10 minutes et quand on revient sur la fenêtre (au plus une fois par minute) :
 // la pastille « 1 » apparaît même si le logiciel est resté ouvert pendant la publication.
 let last=0;const auto=()=>{if(Date.now()-last<60000)return;last=Date.now();chk(true).catch(()=>{})};
 setTimeout(auto,4000);setInterval(()=>{last=0;auto()},600000);window.addEventListener('focus',auto);document.addEventListener('visibilitychange',()=>{if(!document.hidden)auto()});
})();
